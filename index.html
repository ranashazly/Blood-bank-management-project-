<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Blood Bank System</title>
    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>
    <aside id="side">
        <div class="logo"><img src="img/logo.png" alt="Blood Bank logo">
            <div><b>Blood Bank System</b><small>Admin dashboard</small></div>
        </div>
        <nav id="nav"></nav>
        <div class="foot">
            <div class="user" id="adm"></div><button class="btn ghost" style="width:100%"
                onclick="logout()">Logout</button>
        </div>
    </aside>
    <div class="wrap">
        <header><button class="btn ghost menu" onclick="side.classList.toggle('open')">☰</button><span
                class="online"><i></i>System online</span>
            <input id="gs" type="search" placeholder="Search ID or name, then press Enter"><span id="date"
                class="muted"></span>
            <a href="#alerts" class="bell" title="Alerts"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" />
                </svg><i id="bc"></i></a>
        </header>
        <main id="main"></main>
    </div>
    <div id="modal"></div>
    <div id="toasts"></div>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
